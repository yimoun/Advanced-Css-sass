<!doctype html>

</head>
<body>
<header>
<h1>Démos — Advanced CSS & Sass</h1>
<p class="tip">Si tu ouvres ce fichier en <code>file://</code>, on utilisera le <strong>fallback JSON inline</strong>. En serveur (<code>http://</code>), on lit <code>sections.json</code>.</p>
</header>


<ol id="list" class="grid" aria-live="polite"></ol>


<!-- Fallback JSON inline pour usage en file:// -->
<script type="application/json" id="sections-fallback">[
{
"slug": "advanced-css-course-master",
"title": "Code principal du cours",
"subtitle": "exercices continus"
}
]</script>


<script>
async function main(){
const items = await loadSections();
console.log('les items', items)
document.getElementById('list').innerHTML = items.map(card).join('');
}


async function loadSections(){
// Essaie d'abord d'aller chercher sections.json via HTTP (fonctionne en serveur)
try {
const res = await fetch('./sections.json', { cache: 'no-store' });
if (res.ok) return await res.json();
} catch (_) { /* probablement CORS en file:// */ }
// Fallback: lit le JSON inline si fetch a échoué
const raw = document.getElementById('sections-fallback')?.textContent || '[]';
try { return JSON.parse(raw); } catch { return []; }
}


function esc(s){
return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}


function hrefFor(it){
// slug = chemin relatif depuis /docs vers un DOSSIER qui contient index.html
const clean = String(it.slug || '').replace(/^\/+|\/+$/g,'');
return clean ? `${clean}/index.html` : '#';
}


function card(it){
const href = hrefFor(it);
const bullets = (it.learn||[]).slice(0,4).map(b => `<li>${esc(b)}</li>`).join('');
return `<li class="card">
<a href="${href}"><h3>${esc(it.title || 'Sans titre')}</h3></a>
${it.subtitle ? `<p>${esc(it.subtitle)}</p>` : ''}
${bullets ? `<ul>${bullets}</ul>` : ''}
<a href="${href}">Ouvrir →</a>
</li>`;
}


main();
</script>
</body>
</html>
